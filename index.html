<!DOCTYPE html>

<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <title>Calculadora</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="calculadora">

    <h1>Calculadora</h1>

    <label for="numero1">
        Primeiro número:
    </label>

    <input
            type="number"
            id="numero1"
    >

    <label for="numero2">
        Segundo número:
    </label>

    <input
            type="number"
            id="numero2"
    >

    <div class="botoes">

        <button id="btnSomar">
            +
        </button>

        <button id="btnSubtrair">
            -
        </button>

        <button id="btnMultiplicar">
            ×
        </button>

        <button id="btnDividir">
            ÷
        </button>

    </div>

    <p>
        Resultado:
        <strong id="resultado">
            0
        </strong>
    </p>

</div>

<script src="script.js"></script>

</body>

</html>
